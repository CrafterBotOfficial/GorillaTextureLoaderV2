name: Auto Build
on:
  workflow_dispatch:
  push:

jobs:
  auto-build:
    name: Auto Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run the build
      env:
        CI: TRUE 
      run: |
          dotnet restore
          dotnet build -c Debug
          dotnet build -c Release
